<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de la Tortuga 🐢</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #e0f7fa;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #00695c;
    }
    p {
      color: #004d40;
      font-size: 1.1rem;
    }
    #gameCanvas {
      background-color: #a5d6a7;
      border: 4px solid #2e7d32;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>¡Mueve a la Tortuga! 🐢</h1>
  <p>Usa las <strong>flechas del teclado</strong> (⬆️ ⬇️ ⬅️ ➡️) para moverte.</p>
  
  <canvas id="gameCanvas" width="500" height="400"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Posición inicial de la tortuga
    let posX = 230;
    let posY = 200;
    const velocidad = 15;

    function dibujar() {
      // Limpiar el lienzo
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Dibujar la tortuga (emoji)
      ctx.font = '45px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🐢', posX, posY);
    }

    // Escuchar las teclas presionadas
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        e.preventDefault(); // Evita que la página se desplace
      }

      if (e.key === 'ArrowUp' && posY > 30) posY -= velocidad;
      if (e.key === 'ArrowDown' && posY < canvas.height - 30) posY += velocidad;
      if (e.key === 'ArrowLeft' && posX > 30) posX -= velocidad;
      if (e.key === 'ArrowRight' && posX < canvas.width - 30) posX += velocidad;

      dibujar();
    });

    // Dibujar la primera vez
    dibujar();
  </script>

</body>
</html>
